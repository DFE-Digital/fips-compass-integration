name: fips-frontend deployment

env:
  AZURE_WEBAPP_NAME: fips-frontend   # set this to the name of your Azure Web App
  AZURE_WEBAPP_PACKAGE_PATH: '.'      # path to your web app project, defaults to repo root
  DOTNET_VERSION: '10.0.x'

on:
  push:
    branches: [ "dev" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Nested so src/Fips.Web's relative reference to ../../../FIPS/dfe-frontend resolves inside the workspace.
      - uses: actions/checkout@v4
        with:
          path: fips-compass-integration

      - name: Check out DfE frontend
        uses: actions/checkout@v4
        with:
          repository: DFE-Digital/dfefrontend
          path: FIPS/dfe-frontend

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v3
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('fips-compass-integration/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore NuGet packages
        working-directory: fips-compass-integration
        run: dotnet restore src/Fips.Web/Fips.Web.csproj

      - name: Build with dotnet
        working-directory: fips-compass-integration
        run: dotnet build src/Fips.Web/Fips.Web.csproj --configuration Release --verbosity quiet

      - name: Publish with dotnet
        working-directory: fips-compass-integration
        run: dotnet publish src/Fips.Web/Fips.Web.csproj -c Release -o ${{env.DOTNET_ROOT}}/myapp --verbosity quiet

      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Development'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_FIPS_FRONTEND }}
          package: .
